<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Tap at a Time ✨</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #38243f; overflow: hidden;
    background: radial-gradient(circle at top left, #ffe0ef, transparent 42%),
                linear-gradient(135deg, #ffd6e7, #e6dcff 55%, #d7f4ff);
  }
  .card {
    width: min(90vw, 440px); padding: 36px 26px; text-align: center;
    border: 1px solid #ffffffaa; border-radius: 28px;
    background: #ffffffc9; box-shadow: 0 20px 60px #7b4b7b2b;
    backdrop-filter: blur(12px);
  }
  .sparkle { font-size: 2rem; }
  h1 { margin: 10px 0 8px; font-size: 1.65rem; }
  #message {
    min-height: 90px; display: grid; place-items: center;
    margin: 22px 0; padding: 16px; border-radius: 20px;
    background: #fff0f7; color: #b52f72; font-size: 1.55rem;
    font-weight: 800; line-height: 1.25;
  }
  button {
    border: 0; border-radius: 999px; padding: 15px 28px;
    color: white; background: linear-gradient(110deg, #ff5e9c, #9b68ee);
    font-size: 1rem; font-weight: 750; cursor: pointer;
    box-shadow: 0 8px 20px #c45b9b55; transition: transform .15s;
  }
  button:active { transform: scale(.96); }
  #count { margin-top: 16px; color: #806b87; font-size: .9rem; }
  .final { animation: pop .5s ease; }
  @keyframes pop { 0% {transform:scale(.7) rotate(-4deg);opacity:0}
                   70% {transform:scale(1.08)} 100% {transform:scale(1);opacity:1} }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .heart { position: absolute; bottom: -30px; animation: float 4s linear forwards; opacity: .8; }
  @keyframes float { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main class="card">
  <div class="sparkle">💗 ✨ 💗</div>
  <h1>A tiny message for you</h1>
  <div id="message" aria-live="polite">Ready? Tap the button 👀</div>
  <button id="tapButton" type="button">Tap me 💖</button>
  <div id="count">Tap 1 of 5</div>
</main>
<script>
  const messages = [
    "You are cute 🥹",
    "You are hot 🔥",
    "You are pretty 🌸",
    "You are amazing ✨",
    "OMM BHAI PARTY DEKH?? 🥳🎉"
  ];
  let taps = 0;
  const message = document.getElementById("message");
  const button = document.getElementById("tapButton");
  const count = document.getElementById("count");
  const hearts = document.getElementById("hearts");

  function floatHeart() {
    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = ["💗", "✨", "💕", "🎉"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (18 + Math.random()*22) + "px";
    hearts.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }

  button.addEventListener("click", () => {
    if (taps >= messages.length) {
      taps = 0;
      button.textContent = "Tap me 💖";
    }
    taps++;
    message.classList.remove("final");
    void message.offsetWidth;
    message.textContent = messages[taps-1];
    if (taps === messages.length) {
      message.classList.add("final");
      button.textContent = "Again? 😏";
      count.textContent = "Mission completed 🏆";
      for (let i=0; i<12; i++) setTimeout(floatHeart, i*90);
    } else {
      count.textContent = `Tap ${taps+1} of 5`;
    }
  });
</script>
</body>
</html>
